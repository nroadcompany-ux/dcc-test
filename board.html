<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCC · 자료 게시판</title><style>
:root{--ink:#233b5e;--muted:#70819c;--blue:#2164df;--line:#dfe6ef;--bg:#f7f9fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}main{max-width:1040px;margin:0 auto;padding:42px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:30px}h1{margin:8px 0;font-size:30px}p{color:var(--muted);line-height:1.6}a{color:var(--blue)}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:white;color:var(--ink);cursor:pointer;font:inherit;font-weight:700;text-decoration:none;display:inline-block}.btn.blue{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:#c93446}.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 24px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:12px;border-radius:10px;border:1px solid var(--line);font:inherit;background:white}.toolbar input{flex:1;min-width:180px}.status{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}.tag{display:inline-flex;background:#edf4ff;color:#2164df;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}.card h2{font-size:19px;margin:12px 0 5px}.card p{margin:4px 0 15px}.links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meta{font-size:12px;color:var(--muted);margin-top:12px}.empty{padding:40px;text-align:center;color:var(--muted)}dialog{border:none;border-radius:20px;box-shadow:0 30px 90px #253a5a44;width:min(540px,95vw);padding:24px}dialog::backdrop{background:#10213c88}dialog label{display:block;margin:12px 0;font-weight:700;font-size:13px}dialog input,dialog select,dialog textarea{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin-top:6px}dialog textarea{min-height:125px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.info{padding:12px;border-radius:12px;background:#edf4ff;color:#355b90}.error{color:#b52335;background:#fff0f1;padding:10px;border-radius:10px;margin:10px 0}
@media(max-width:650px){main{padding:24px 16px}h1{font-size:25px}.card{padding:17px}}
</style></head><body><main><header><div><a href="/">← DCC 대시보드</a><h1>자료 게시판</h1><p>생ZONE 디자인 가이드와 검수용 서비스 링크를 관리합니다.</p></div><div><span id="authStatus" class="status"></span> <button class="btn blue" id="newBtn" hidden>+ 글 등록</button></div></header><div class="info">전체 구성원은 글과 링크를 읽을 수 있으며, 작성·수정·삭제는 DCC 로그인 사용자만 가능합니다. 변경 내용은 서버 공유 저장소에 보관됩니다.</div><div class="toolbar"><input id="search" type="search" placeholder="제목·내용·링크 검색" aria-label="게시물 검색"><select id="filter" aria-label="분류 필터"><option value="">전체 분류</option></select><button class="btn" id="reload">새로고침</button></div><div id="feedback" role="status"></div><section id="posts"><div class="empty">게시물 불러오는 중…</div></section></main><dialog id="modal"><form id="form"><h2 id="formTitle">자료 등록</h2><input id="id" type="hidden"><label>분류<input id="category" maxlength="50" required placeholder="디자인 가이드"></label><label>제목<input id="title" maxlength="120" required></label><label>설명<textarea id="description" maxlength="2000" placeholder="핵심 내용과 사용 용도"></textarea></label><label>연결 URL<input id="url" maxlength="1000" placeholder="https:// 또는 /docs/..."></label><div class="actions"><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn blue" id="save">저장</button></div></form></dialog><script>
const $=id=>document.getElementById(id);let state={version:0,posts:[]},user=null;
function el(tag,attrs={},...children){const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else n.setAttribute(k,v);}children.flat().forEach(c=>n.append(c instanceof Node?c:document.createTextNode(c)));return n;}
function msg(t,err=false){$('feedback').replaceChildren(t?el('div',{class:err?'error':'info',text:t}):'');}
async function request(path,method='GET',data){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'dcc'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j;}
async function load(){try{state=await request('/api/board');render();}catch(e){msg(e.message,true);$('posts').replaceChildren();}}
async function init(){try{user=(await request('/api/auth?action=me')).user;}catch{}$('authStatus').textContent=user?'로그인: '+(user.name||user.username):'읽기 전용 · DCC 로그인 필요';$('newBtn').hidden=!user;await load();}
function render(){const categories=[...new Set(state.posts.map(p=>p.category))];const selected=$('filter').value;$('filter').replaceChildren(el('option',{value:'',text:'전체 분류'}),...categories.map(c=>el('option',{value:c,text:c})));$('filter').value=categories.includes(selected)?selected:'';const term=$('search').value.toLowerCase();const list=state.posts.filter(p=>(!$('filter').value||p.category===$('filter').value)&&[p.title,p.description,p.url].join(' ').toLowerCase().includes(term));$('posts').replaceChildren();if(!list.length){$('posts').append(el('div',{class:'empty',text:'검색 결과가 없습니다.'}));return;}for(const p of list){const card=el('article',{class:'card'},el('span',{class:'tag',text:p.category}),el('h2',{text:p.title}),el('p',{text:p.description||'설명 없음'}));const row=el('div',{class:'links'});if(p.url){const a=el('a',{class:'btn blue',href:p.url,target:'_blank',rel:'noopener noreferrer',text:'자료 열기 ↗'});row.append(a);}if(user){const edit=el('button',{class:'btn',type:'button',text:'수정'});edit.onclick=()=>openForm(p);const del=el('button',{class:'btn danger',type:'button',text:'삭제'});del.onclick=()=>remove(p);row.append(edit,del);}card.append(row,el('div',{class:'meta',text:'수정 '+new Date(p.updatedAt).toLocaleString('ko-KR')+' · '+p.author}));$('posts').append(card);}}
function openForm(p){$('form').reset();$('id').value=p?.id||'';$('category').value=p?.category||'서비스 링크';$('title').value=p?.title||'';$('description').value=p?.description||'';$('url').value=p?.url||'';$('formTitle').textContent=p?'자료 수정':'자료 등록';$('modal').showModal();}
async function remove(p){if(!confirm('“'+p.title+'” 글을 삭제하시겠습니까?'))return;try{state=await request('/api/board','DELETE',{id:p.id,baseVersion:state.version});msg('삭제했습니다.');render();}catch(e){msg(e.message,true);await load();}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const data={baseVersion:state.version,id:$('id').value,category:$('category').value,title:$('title').value,description:$('description').value,url:$('url').value};$('save').disabled=true;try{state=await request('/api/board',data.id?'PUT':'POST',data);$('modal').close();msg('저장했습니다.');render();}catch(e){msg(e.message,true);await load();}finally{$('save').disabled=false;}});
$('newBtn').onclick=()=>openForm();$('cancel').onclick=()=>$('modal').close();$('reload').onclick=load;$('search').oninput=render;$('filter').onchange=render;init();
</script></body></html>
