<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NROAD DCC · 관리자 자료 관리</title><style>
:root{--navy:#142e4e;--blue:#325feb;--bg:#f4f7fb;--line:#e2e8f0;--ink:#19283e}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 22px}header strong{font-size:20px}header a{color:var(--blue);text-decoration:none;font-size:13px}header .right{margin-left:auto;display:flex;gap:10px;align-items:center}.shell{display:grid;grid-template-columns:165px minmax(0,1fr);min-height:calc(100vh - 66px)}nav{background:var(--navy);color:white;padding:22px 10px}nav p{font-size:11px;opacity:.6;padding:0 13px}nav button{display:block;width:100%;border:0;text-align:left;background:transparent;color:#d7e7fa;border-radius:8px;padding:13px;cursor:pointer}nav button.active{background:#345c84;color:white}main{min-width:0;padding:23px clamp(16px,2vw,36px)}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px}button{font:inherit;cursor:pointer}.btn{border:1px solid #cfd8e5;background:white;border-radius:9px;padding:9px 13px;font-size:13px;color:var(--ink)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.red{color:#bd3542}.btn:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{padding:10px;border:1px solid #cfd8e5;border-radius:9px;font:inherit;max-width:100%;background:white}input.search{width:min(370px,100%)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f8fafc;color:#526178;font-size:12px}td .actions{display:flex;gap:5px;white-space:nowrap}.muted{color:#6d7b8c;font-size:12px}.error{color:#bd3542;font-size:13px;white-space:pre-wrap}.hidden{display:none!important}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%}dialog{border:0;border-radius:16px;padding:22px;width:min(550px,94vw);box-shadow:0 15px 70px #122d4d33}dialog::backdrop{background:#0d254c77}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}.summary .panel{margin:0}.summary b{font-size:25px;display:block}.login{max-width:480px;margin:36px auto}@media(max-width:800px){.shell{grid-template-columns:1fr}nav{display:flex;gap:5px;padding:8px;overflow:auto}nav p{display:none}nav button{width:auto;white-space:nowrap}main{padding:15px}.summary{grid-template-columns:1fr 1fr 1fr}th,td{white-space:nowrap}} </style></head><body>
<header><strong>payplay · DCC</strong><span class="muted">관리자 작업 공간</span><div class="right"><span id="who" class="muted"></span><a href="/">DCC 돌아가기 ↗</a><button id="logout" class="btn hidden">로그아웃</button></div></header>
<div class="shell"><nav><p>관리 메뉴</p><button data-tab="items" class="active">링크·서비스 관리</button><button data-tab="groups">그룹·카테고리</button><button data-tab="history">변경 기록</button><button data-tab="users">계정 관리</button></nav><main>
<section id="loginBox" class="panel login hidden"><h1>관리자 로그인</h1><p class="muted">기존 DCC 관리자 계정으로 로그인하세요. 이메일 형식이 아닌 등록된 사용자 아이디를 입력해야 합니다.</p><form id="loginForm"><div class="field"><label>관리자 아이디</label><input id="username" autocomplete="username" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary">로그인</button><p class="error" id="loginError"></p></form></section>
<section id="workspace" class="hidden"><div class="topline"><div><h1 id="title">링크·서비스 관리</h1><span class="muted">관리자 입력 내용은 기존 DCC 서버 저장소에 즉시 반영됩니다.</span></div><button class="btn" id="refresh">새로고침</button></div><div class="summary"><div class="panel"><span class="muted">전체 링크</span><b id="cntItems">0</b></div><div class="panel"><span class="muted">그룹</span><b id="cntGroups">0</b></div><div class="panel"><span class="muted">데이터 버전</span><b id="version">-</b></div></div><div class="panel"><div class="toolbar"><input id="search" class="search" placeholder="제목, 설명, 주소 검색"><select id="groupFilter"><option value="">전체 그룹</option></select><button id="add" class="btn primary">+ 항목 추가</button><span id="notice" class="muted"></span></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></section>
</main></div><dialog id="dlg"><h2 id="dlgTitle"></h2><form id="editForm"><div id="fields"></div><p class="error" id="editError"></p><div class="dialogactions"><button type="button" class="btn" id="cancel">취소</button><button class="btn primary">저장</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);const state={user:null,doc:null,tab:'items',search:''};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let editing=null;
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'dcc'},body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(data.error||'서버 오류 '+r.status);e.status=r.status;e.current=data.current;throw e}return data}
const btn=(text,fn,kind='')=>{const b=document.createElement('button');b.className='btn '+kind;b.textContent=text;b.onclick=fn;return b};const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function init(){try{state.user=(await api('/api/auth?action=me')).user}catch(e){state.user=null}showAuth();if(state.user)await reload()}
function showAuth(){const ok=!!state.user;$('#loginBox').classList.toggle('hidden',ok);$('#workspace').classList.toggle('hidden',!ok);$('#logout').classList.toggle('hidden',!ok);$('#who').textContent=ok?state.user.name+' · '+state.user.role:'';document.querySelector('[data-tab="users"]').style.display=ok&&state.user.role==='admin'?'':'none'}
async function reload(){try{state.doc=await api('/api/data');render();$('#notice').textContent=''}catch(e){$('#notice').textContent=e.message}}
async function persist(data){try{const next=await api('/api/data','PUT',{baseVersion:state.doc.version,data});state.doc=next;render();$('#notice').textContent='저장 완료 · '+new Date().toLocaleTimeString('ko-KR');return true}catch(e){if(e.status===409){state.doc=e.current;render();throw new Error('다른 관리자가 먼저 수정했습니다. 새로고침 후 다시 편집하세요.')}throw e}}
function render(){if(!state.doc)return;const {groups,items}=state.doc.data;$('#cntItems').textContent=items.length;$('#cntGroups').textContent=groups.length;$('#version').textContent=state.doc.version;$('#title').textContent=({items:'링크·서비스 관리',groups:'그룹·카테고리 관리',history:'변경 기록',users:'계정 관리'})[state.tab];$('#search').value=state.search;$('#search').style.display=['items','groups'].includes(state.tab)?'':'none';$('#groupFilter').style.display=state.tab==='items'?'':'none';$('#add').style.display=['items','groups'].includes(state.tab)||(state.tab==='users'&&state.user?.role==='admin')?'':'none';$('#add').textContent=state.tab==='groups'?'+ 그룹 추가':state.tab==='users'?'+ 계정 추가':'+ 항목 추가';$('#groupFilter').innerHTML='<option value="">전체 그룹</option>'+groups.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const head=$('#thead'),body=$('#tbody');head.innerHTML='';body.innerHTML='';const hs=state.tab==='items'?['코드','항목명','그룹','단계','링크','관리']:state.tab==='groups'?['그룹명','상위 그룹','태그','관리']:state.tab==='history'?['시각','작업자','변경 사항']:['아이디','이름','권한','관리'];const tr=document.createElement('tr');hs.forEach(s=>{const th=document.createElement('th');th.textContent=s;tr.append(th)});head.append(tr);
if(state.tab==='items'){items.filter(x=>(!$('#groupFilter').value||x.groupId===$('#groupFilter').value)&&[x.title,x.desc,x.url,x.code].join(' ').toLowerCase().includes(state.search.toLowerCase())).forEach(x=>addRow([x.code,x.title,groups.find(g=>g.id===x.groupId)?.name||'',x.stage,x.url],x,'item'))}
if(state.tab==='groups'){groups.filter(g=>[g.name,g.desc].join(' ').toLowerCase().includes(state.search.toLowerCase())).forEach(x=>addRow([x.name,groups.find(g=>g.id===x.parentId)?.name||'최상위',x.tag],x,'group'))}
if(state.tab==='history'){api('/api/auth?action=history').then(r=>{body.innerHTML='';(r.history||[]).forEach(x=>addRow([x.t,x.u,(x.changes||[]).join(' / ')],null,''))}).catch(e=>$('#notice').textContent=e.message)}
if(state.tab==='users'){api('/api/auth?action=users').then(r=>{body.innerHTML='';(r.users||[]).forEach(x=>addRow([x.username,x.name,x.role],x,'user'))}).catch(e=>$('#notice').textContent=e.message)}
}
function addRow(vals,obj,type){const tr=document.createElement('tr');vals.forEach(v=>{const td=document.createElement('td');td.textContent=v||'—';tr.append(td)});if(type){const td=document.createElement('td');td.className='actions';td.append(btn('수정',()=>openEditor(type,obj)));td.append(btn('삭제',()=>remove(type,obj),'red'));tr.append(td)}$('#tbody').append(tr)}
function field(label,name,value='',type='text',opts=[]){return '<div class="field"><label for="f-'+name+'">'+label+'</label>'+(type==='select'?'<select id="f-'+name+'" name="'+name+'">'+opts.map(([v,l])=>'<option value="'+esc(v)+'" '+(value===v?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>':'<input id="f-'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'">')+'</div>'}
function openEditor(type,obj=null){editing={type,obj};$('#dlgTitle').textContent=(obj?'수정 · ':'추가 · ')+({item:'링크/서비스',group:'그룹',user:'계정'})[type];$('#editError').textContent='';const g=state.doc.data.groups;let html='';
if(type==='item'){html+=field('제목','title',obj?.title||'')+field('코드','code',obj?.code||'')+field('설명','desc',obj?.desc||'')+field('주소 (http/https 또는 ./경로)','url',obj?.url||'')+field('그룹','groupId',obj?.groupId||g[0]?.id,'select',g.map(x=>[x.id,x.name]))+field('상태','stage',obj?.stage||'test','select',[['official','공식'],['test','테스트'],['plan','기획']])+field('제작일','date',obj?.date||'','date')+field('열기','target',obj?.target||'new','select',[['new','새 탭'],['same','현재 탭']])}
if(type==='group'){html+=field('그룹 이름','name',obj?.name||'')+field('태그','tag',obj?.tag||'')+field('설명','desc',obj?.desc||'')+field('상위 그룹','parentId',obj?.parentId||'','select',[['','최상위'],...g.filter(x=>x.id!==obj?.id).map(x=>[x.id,x.name])])}
if(type==='user'){html+=field('아이디 (변경 불가)','username',obj?.username||'')+field('이름','name',obj?.name||'')+field('권한','role',obj?.role||'editor','select',[['editor','편집자'],['admin','관리자']])+field(obj?'새 비밀번호 (변경할 때만)':'비밀번호 (8자 이상)','password','','password')}
$('#fields').innerHTML=html;$('#dlg').showModal()}
$('#editForm').onsubmit=async e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.target));const {type,obj}=editing;try{if(type==='user'){if(obj){form.username=obj.username;if(!form.password)delete form.password}await api('/api/auth?action=users',obj?'PUT':'POST',form);$('#dlg').close();render();return}const data=structuredClone(state.doc.data);if(type==='item'){const item={id:obj?.id||uid('i'),...form};if(obj)data.items[data.items.findIndex(x=>x.id===obj.id)]=item;else data.items.push(item)}else{const group={id:obj?.id||uid('g'),...form,parentId:form.parentId||null};if(obj)data.groups[data.groups.findIndex(x=>x.id===obj.id)]=group;else data.groups.push(group)}await persist(data);$('#dlg').close()}catch(e){$('#editError').textContent=e.message}};
async function remove(type,obj){if(!confirm('정말 삭제하시겠습니까? 삭제한 항목은 화면에서 사라집니다.'))return;try{if(type==='user'){await api('/api/auth?action=users&username='+encodeURIComponent(obj.username),'DELETE');render();return}const data=structuredClone(state.doc.data);if(type==='item')data.items=data.items.filter(x=>x.id!==obj.id);else{if(data.items.some(x=>x.groupId===obj.id)||data.groups.some(x=>x.parentId===obj.id))throw new Error('하위 그룹이나 링크가 있습니다. 먼저 이동 또는 삭제하세요.');data.groups=data.groups.filter(x=>x.id!==obj.id)}await persist(data)}catch(e){alert(e.message)}}
$('#add').onclick=()=>openEditor(state.tab==='groups'?'group':state.tab==='users'?'user':'item');$('#cancel').onclick=()=>$('#dlg').close();$('#refresh').onclick=reload;$('#search').oninput=e=>{const pos=e.target.selectionStart;state.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#groupFilter').onchange=()=>{const g=$('#groupFilter').value;render();$('#groupFilter').value=g;render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.search='';render()});$('#logout').onclick=async()=>{await api('/api/auth?action=logout','POST');state.user=null;showAuth()};$('#loginForm').onsubmit=async e=>{e.preventDefault();try{state.user=(await api('/api/auth?action=login','POST',{username:$('#username').value,password:$('#password').value})).user;$('#password').value='';showAuth();await reload()}catch(err){$('#loginError').textContent=err.message}};init();
</script></body></html>
