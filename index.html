<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCC Test Dashboard</title>
<style>
:root{--ink:#191f28;--muted:#6b7684;--line:#e5e8eb;--blue:#325feb;--soft:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif}.wrap{max-width:920px;margin:0 auto;padding:64px 24px}header{margin-bottom:32px}h1{margin:0 0 10px;font-size:34px;letter-spacing:-1.2px}.sub{margin:0;color:var(--muted)}.list{display:flex;flex-direction:column;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:#fff;color:inherit;text-decoration:none;transition:.18s}.item:hover{border-color:#9eb4ff;box-shadow:0 12px 30px rgba(25,31,40,.08);transform:translateY(-1px)}.index{width:42px;height:42px;border-radius:12px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:800;flex:0 0 auto}.info{flex:1}.info strong{display:block;font-size:19px;margin-bottom:6px}.info span{color:var(--muted);font-size:14px}.arrow{color:var(--blue);font-weight:800;font-size:20px}.note{margin-top:26px;color:#8b95a1;font-size:13px}@media(max-width:600px){.wrap{padding:40px 18px}.item{padding:18px}.info strong{font-size:17px}}
</style>
</head>
<body><main class="wrap"><header><h1>DCC Test Dashboard</h1><p class="sub">내부 테스트 페이지 목록</p></header><section class="list"><a class="item" href="./payplay.html"><span class="index">01</span><span class="info"><strong>PayPlay 혜택·매장 솔루션</strong><span>정부지원사업 탐색 및 매장 운영 솔루션 테스트 화면</span></span><span class="arrow">→</span></a></section><p class="note">테스트 페이지는 아래 목록에 일렬로 추가할 수 있습니다.</p></main></body></html>
