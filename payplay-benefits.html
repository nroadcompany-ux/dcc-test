oin('')}</div><div class="catalog">${selected.map(drawItem).join('')||'<p>조건에 해당하는 항목이 없습니다.</p>'}</div></main></div>`}
function renderBenefit(){let filtered=examples.filter(x=>(selection==='전체'||x[4]===selection)&&[x[0],x[1],x[4]].join(' ').includes(search)),cats=[...new Set(examples.map(x=>x[4]))];return `<div class="ey">SAENGZONE · PUBLIC BENEFIT LIBRARY</div><div class="between"><div><h1>혜택 찾아 받기</h1><p class="lead">정부지원사업과 공공금융을 종류·지역·모집기간에 따라 살펴봅니다.</p></div><button class="btn" onclick="go('purpose')">← 6대 목적</button></div><div class="feature"><div><div class="ey">혜택 유형부터 선택</div><h2>내 사업장에 맞는 지원은 무엇일까요?</h2><p>정부 보조금·정책융자·보증은 성격이 다릅니다. 현재 표는 연구보고서의 조사 사례이며 실시간 접수 확인 결과가 아닙니다.</p></div><div class="illustration"><span class="figure">PUB</span></div></div><div class="two ${sideOpen?'':'sidebar-closed'}"><aside class="aside"><div class="ey" style="margin:8px">지원사업 분야</div><button class="${selection==='전체'?'on':''}" onclick="filterSet('전체')">전체 조사 사례</button>${cats.map(x=>`<button class="${selection===x?'on':''}" onclick="filterSet('${x}')">${x}</button>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><button onclick="setPurpose('buy')">결제·기기 상품 보기 →</button><button onclick="setPurpose('expert')">경정청구 상담 →</button></aside><main><button class="sidebar-toggle" onclick="toggleSidebar()" aria-expanded="${sideOpen}" aria-label="지원사업 분야 사이드바 접기 또는 펼치기">${sideOpen?'◀ 분야 접기':'▶ 분야 펼치기'}</button><div class="box"><div class="between"><div><h2>${esc(selection==='전체'?'조사된 공고·지원사업':selection)} <span class="cnt">${filtered.length}건</span></h2><div class="tiny">접수 시작 · 종료 · 지역 · 검증상태를 한 줄에서 비교</div></div><button class="btn" onclick="exportCSV()">CSV 저장</button></div><div class="listtools"><input placeholder="사업명·지역 검색" value="${esc(search)}" oninput="search=this.value;renderKeepFocus()"><select onchange="selection=this.value;render()"><option>전체</option>${cats.map(x=>`<option ${selection===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="search='';selection='전체';render()">초기화</button></div><div class="tablebox"><table class="data"><thead><tr><th>공고·지원사업</th><th>분야</th><th>지역</th><th>시작일</th><th>종료일</th><th>검증상태</th><th>내용</th></tr></thead><tbody>${filtered.map((x,i)=>`<tr><td><button class="link" onclick="detailNotice('${encodeURIComponent(x[0])}')">${esc(x[0])} ↗</button></td><td>${esc(x[4])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td><span class="tag ${x[5].includes('재확인')?'gray':''}">${esc(x[5])}</span></td><td><button class="btn" onclick="detailNotice('${encodeURIComponent(x[0])}')">보기</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted" style="text-align:center;padding:26px">조건에 맞는 공고가 없습니다. 검색어나 분야를 바꿔 보세요.</td></tr>'}</tbody></table></div><div class="table-scroll-controls"><button type="button" class="move" onclick="shiftNoticeTable(-1)" aria-label="표 왼쪽 이동">←</button><span>공고 표 좌우 이동</span><input class="table-range" type="range" min="0" max="100" value="0" aria-label="지원사업 목록 가로 이동" oninput="rangeNoticeTable(this.value)"><button type="button" class="move" onclick="shiftNoticeTable(1)" aria-label="표 오른쪽 이동">→</button></div><p class="scroll-hint">표가 화면보다 넓을 때 목록 바로 아래 가로 막대로 이동할 수 있습니다.</p><p class="note">12건은 첨부 연구보고서의 조사 사례입니다. 검증되지 않은 수십 건의 가상 모집공고를 실제 공고처럼 생성하지 않았습니다. 실제 조회 가능한 최신 공고 데이터 연동은 별도 작업입니다.</p></div></main></div>`}
function renderRoad(){return `<div class="road"><div class="between"><div><div class="ey">OFFLINE SALES · EDITABLE STORY</div><h1>사장님을 위한 5단계 상담 로드맵</h1><p class="lead">각 단계에 맞는 상품을 보여주고, 언제든 로드맵으로 돌아올 수 있습니다.</p></div><button class="btn" onclick="resetOrder()">기본 순서</button></div><div class="box" style="margin:18px 0"><b>빠른 이동 · 단계 순서는 ↑ ↓ 버튼으로 변경</b><div class="pills">${order.map((id,i)=>`<button class="pill" onclick="document.getElementById('step-${id}').scrollIntoView({block:'start'})">${i+1}. ${esc(roadDefault.find(x=>x[0]===id)[1])}</button>`).join('')}</div></div>${order.map((id,i)=>{let x=roadDefault.find(y=>y[0]===id),p=x[4].map(k=>items.find(y=>y[0]===k)).filter(Boolean);return `<section class="roaditem" id="step-${id}"><div class="num">0${i+1}</div><div class="roadcard"><div class="roadhead"><div><div class="between"><div class="ey">STEP ${i+1} · 선택형 영업 단계</div><div class="toolbar"><button class="move" onclick="move('${id}',-1)">↑</button><button class="move" onclick="move('${id}',1)">↓</button></div></div><h2>${esc(x[1])}</h2><p class="lead">${esc(x[2])}</p><p class="muted"><b>이렇게 진행해요</b><br>${esc(x[3])}</p></div><div class="illustration"><span class="figure">${x[5]}</span></div></div><div class="offerstrip"><b>이 단계에서 함께 보여줄 서비스</b><div class="row">${p.map(z=>`<button class="pill" style="background:#fff" onclick="detailItem('${z[0]}')">${z[6]} ${esc(z[1])} →</button>`).join('')}</div></div><div class="toolbar">${id==='policy'?'<button class="btn primary" onclick="selection=\'전체\';search=\'\';go(\'benefit\')">공고 전체 보기 →</button>':`<button class="btn primary" onclick="${p.length?`detailItem('${p[0][0]}')`:`go('catalog')`}">대표 서비스 보기 →</button>`}<button class="btn" onclick="go('catalog');purpose='${id==='growth'?'growth':id==='tax'?'expert':'buy'}';render()">상품 목록</button><button class="btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 맨 위로</button></div></div></section>`}).join('')}<div class="box"><h2>상담 마무리</h2><p>관심 서비스 ${basket.length}개 · 고객에게 필요한 상품을 확인하고 견적 또는 상담을 안내합니다.</p><button class="btn primary" onclick="openBasket()">관심상품·상담요약 보기 →</button></div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.id==='tab-'+view));$('view').innerHTML=view==='purpose'?renderPurpose():view==='benefit'?renderBenefit():view==='catalog'?renderCatalog():renderRoad()}function renderKeepFocus(){const a=document.activeElement;const pos=a?.selectionStart;render();let x=document.querySelector('input[placeholder="'+(view==='benefit'?'사업명·지역 검색':'서비스 검색')+'"]');if(x){x.focus();try{x.setSelectionRange(pos,pos)}catch{}}}
function closeDrawer(){$('back').classList.remove('show')}function openDrawer(html){$('drawer').innerHTML=html;$('back').classList.add('show')}

function shiftNoticeTable(direction){const el=document.querySelector('.tablebox');if(!el)return;el.scrollBy({left:direction*Math.max(320,el.clientWidth*.6),behavior:'smooth'});setTimeout(syncNoticeRange,450)}
function syncNoticeRange(){const el=document.querySelector('.tablebox'),range=document.querySelector('.table-range');if(el&&range)range.value=el.scrollWidth>el.clientWidth?Math.round(el.scrollLeft/(el.scrollWidth-el.clientWidth)*100):0}
function rangeNoticeTable(value){const el=document.querySelector('.tablebox');if(el)el.scrollLeft=(el.scrollWidth-el.clientWidth)*Number(value)/100}
const demoProfile={store:'시연용 행복카페',region:'경기도 수원시',industry:'음식·카페',status:'운영 중',operator:'홍길동 (가상)'};
function demoProfileBlock(){return `<div class="modal-line"><b>사업장 정보 · 시연용</b><p class="tiny">실제 로그인 및 정부기관 자동 입력은 미연결입니다. 아래 내용은 가상 계정으로 미리 채운 예시이며 수정 가능합니다.</p><div class="apply-grid"><div><label>상호명</label><input id="p-store" value="${esc(demoProfile.store)}"></div><div><label>대표자(시연)</label><input id="p-operator" value="${esc(demoProfile.operator)}"></div><div><label>지역</label><input id="p-region" value="${esc(demoProfile.region)}"></div><div><label>업종</label><input id="p-industry" value="${esc(demoProfile.industry)}"></div></div></div>`}
function preparationPanel(encoded){let x=examples.find(y=>y[0]===decodeURIComponent(encoded));if(!x)return;openDrawer(`<div class="between"><span class="ey">지원사업 신청 준비 · DEMO</span><button class="btn" onclick="closeDrawer()">닫기</button></div><h2 style="margin-top:16px">${esc(x[0])}</h2><p>공고 확인 → 사업장 정보 확인 → 서류 준비 → 공식기관 신청 → 진행 기록</p>${demoProfileBlock()}<div class="modal-line"><b>신청 전 확인</b><p class="tiny">대상·모집기간·첨부 서류·자부담·선정 전 구매 가능 여부는 공식 공고를 확인해야 합니다.</p><label><input type="checkbox" id="verify-notice" style="min-width:0"> 공고 원문과 신청조건을 직접 확인했습니다 (시연)</label></div><div class="toolbar"><button class="btn primary" onclick="recordDemoApplication('${encoded}')">신청 준비 기록(시연)</button><button class="btn" onclick="showOfficialSources()">공식 공고 검색처 보기</button><button class="btn" onclick="closeDrawer()">목록으로</button></div><p class="note">로그인하면 사업장 프로필을 불러오는 기능, 기관 사이트의 자동입력·접수 결과 수집은 연동 후 구현합니다. 이 화면은 실제 접수가 아닙니다.</p>`)}
function recordDemoApplication(encoded){const x=examples.find(y=>y[0]===decodeURIComponent(encoded));if(!x)return;const checked=document.querySelector('#verify-notice')?.checked;const store=document.querySelector('#p-store')?.value||'';const records=JSON.parse(localStorage.getItem('sz-demo-applications')||'[]');records.push({notice:x[0],store,checked,status:'신청 준비(사용자 기록 · 시연)',date:new Date().toISOString()});localStorage.setItem('sz-demo-applications',JSON.stringify(records));alert('신청 준비만 시연 기록되었습니다. 실제 기관 접수는 진행되지 않았습니다.');closeDrawer()}
function showOfficialSources(){openDrawer(`<div class="between"><b>공식 신청처 안내</b><button class="btn" onclick="closeDrawer()">닫기</button></div><p>이 조사 사례에는 각 공고별 공식 신청 URL과 실시간 접수 여부가 확인되지 않았습니다. 실제 신청 전 아래 공식 포털에서 정확한 모집회차·접수처를 확인해 주세요.</p><p><a href="https://www.sbiz24.kr/" target="_blank" rel="noopener noreferrer">소상공인24 ↗</a></p><p><a href="https://www.bizinfo.go.kr/" target="_blank" rel="noopener noreferrer">기업마당 ↗</a></p><p><a href="https://www.k-startup.go.kr/" target="_blank" rel="noopener noreferrer">K-Startup ↗</a></p><p class="note">포털 검색 링크가 해당 공고의 직접 신청 URL인 것은 아닙니다.</p>`)}

function detailItem(id){let x=items.find(y=>y[0]===id);if(!x)return;openDrawer(`<div class="between"><span class="ey">서비스 상세 · ${esc(labelType(x[2]))}</span><button class="btn" onclick="closeDrawer()"> 닫기</button></div><div class="illustration" style="margin:20px 0"><span class="figure">${x[6]}</span></div><h2>${esc(x[1])}</h2><p class="lead">${esc(x[5])}</p><div class="detailfacts"><div><small>유형</small><b>${esc(x[2])}</b></div><div><small>분류</small><b>${esc(x[4])}</b></div><div><small>현재 상태</small><b>연구·시연 후보</b></div><div><small>실제 공급·가격</small><b>조건 확인 필요</b></div></div><h3 style="margin-top:22px">어떻게 진행하나요?</h3><p>내 상황 확인 → 상세 조건 비교 → 필요 시 담당자 상담 → 실제 공급·진행 조건 확인</p><p class="note">기재된 할인·무료·월요금·기간은 변경 가능한 연구 예시입니다. 실제 판매 가능 상태·제휴·공급조건이 확인된 상품만 정식 상품으로 표시합니다.</p><div class="toolbar"><button class="btn primary" onclick="add('${id}');closeDrawer()">관심상품에 담기</button><button class="btn" onclick="closeDrawer();go('road')">← 로드맵</button></div>`)}
function detailNotice(encoded){let x=examples.find(y=>y[0]===decodeURIComponent(encoded));if(!x)return;openDrawer(`<div class="between"><span class="ey">공공지원 조사 사례</span><button class="btn" onclick="closeDrawer()" aria-label="상세 닫기">닫기</button></div><h2 style="margin-top:20px">${esc(x[0])}</h2><div class="detailfacts"><div><small>지역</small><b>${esc(x[1])}</b></div><div><small>분야</small><b>${esc(x[4])}</b></div><div><small>접수 시작</small><b>${esc(x[2])}</b></div><div><small>접수 종료</small><b>${esc(x[3])}</b></div><div><small>자료 검증</small><b>${esc(x[5])}</b></div><div><small>실시간 모집 여부</small><b>확인되지 않음</b></div></div><h3 style="margin-top:25px">영업사원 안내 순서</h3><p>사업장 주소·업종 → 공고원문·첨부 확인 → 적합성·제외조건 확인 → 신청 준비 → 공식 기관 접수</p><p class="note">원문·예산·모집상태는 현재 실시간 조회되지 않습니다. 연구 사례를 정식 접수중 공고로 오해하지 않도록 안내합니다.</p><div class="toolbar"><button class="btn primary" onclick="preparationPanel('${encoded}')">신청 준비하기 →</button><button class="btn" onclick="showOfficialSources()">공식 신청처 안내</button><button class="btn" onclick="closeDrawer()">목록으로 복귀</button></div>`)}
function add(id){if(!basket.includes(id))basket.push(id);if($('back').classList.contains('show'))return;openBasket()}function openBasket(){openDrawer(`<div class="between"><span class="ey">상담용 관심상품 목록</span><button class="btn" onclick="closeDrawer()">닫기</button></div><h2>선택된 상품 ${basket.length}개</h2>${basket.map(id=>{let x=items.find(y=>y[0]===id);return `<div class="box" style="padding:11px;margin:8px 0"><div class="between"><b>${x[6]} ${esc(x[1])}</b><button class="btn" onclick="basket=basket.filter(z=>z!=='${id}');openBasket()">삭제</button></div></div>`}).join('')||'<p>관심상품을 먼저 담아주세요.</p>'}<p class="note">현재는 브라우저 메모리에서만 시연됩니다. 개인정보·실제 계약·문의 접수는 저장되지 않습니다.</p><button class="btn primary" onclick="navigator.clipboard?.writeText(basket.map(id=>items.find(x=>x[0]===id)?.[1]).join('\n')).then(()=>alert('상품 목록을 복사했습니다')).catch(()=>alert('브라우저에서 복사를 지원하지 않습니다'))">선택 상품명 복사</button>`)}
function move(id,d){let i=order.indexOf(id),j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];localStorage.setItem('sz-sale-road',JSON.stringify(order));render();document.getElementById('step-'+id)?.scrollIntoView({block:'center'})}function resetOrder(){order=roadDefault.map(x=>x[0]);localStorage.removeItem('sz-sale-road');render()}
function exportCSV(){let a=examples.filter(x=>(selection==='전체'||x[4]===selection)&&[x[0],x[1],x[4]].join(' ').includes(search));let lines=[['사업명','지역','시작','종료','분야','검증상태'],...a].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='생존_지원사업_연구사례.csv';el.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
render();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&typeof closeDrawer==='function')closeDrawer()});
</script></body></html>
