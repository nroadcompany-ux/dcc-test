function renderHome(){return `<div class="hero"><div class="wrap herogrid"><div><span class="eyebrow">사장님을 위한 혜택·매장 솔루션</span><h1>놓치기 쉬운 혜택부터,<br><span style="color:var(--blue)">우리 가게에 필요한 것까지.</span></h1><p>정부지원사업을 찾아보고, 매장 운영비와 마케팅도 함께 살펴보세요.<br>영업사원과 함께해도, 혼자서도 쉽게 확인할 수 있어요.</p>${btn('내가 받을 혜택 찾아보기 →',"openPage('benefits')")}&nbsp;${btn('매장 솔루션 보기',"openPage('services')",'pill ghost')}</div><div class="feature"><p class="featuretitle">이런 것부터 도와드려요</p><div class="metric"><span>정책자금·지원금 확인</span><strong>혜택 탐색 →</strong></div><div class="metric"><span>POS·QR오더·기기 도입</span><strong>상품 체험 →</strong></div><div class="metric"><span>마케팅·세무·비용절감</span><strong>상담 연결 →</strong></div><div class="small" style="margin-top:17px">자료 기준 2026.10.11 · 지원사업 최신 상태는 공식 원문 확인 필요</div></div></div></div><section class="section"><div class="wrap"><h2>어떤 도움이 필요하세요?</h2><p class="sub">가장 관심 있는 주제부터 눌러보세요.</p><div class="cards">${[['혜택 찾아 받기','정책자금 · 기기·시설 지원 · 정부사업','benefits'],['물건·서비스 구매하기','POS · QR오더 · 인터넷 · 렌탈','services'],['매출·고객 늘리기','SNS · 리뷰 · PayPoint · 배달','services'],['비용 줄이기','통신비 · 수수료 · 운영비 점검','services'],['전문가 도움받기','세무 · 노무 · 경영자문','consult'],['배우고 직접 해보기','창업 · 마케팅 · 운영 실습','consult']].map((e,i)=>`<button class="card" onclick="openPage('${e[2]}')"><span class="num">0${i+1}</span><strong>${e[0]}</strong><span>${e[1]}</span></button>`).join('')}</div></div></section><section class="section band"><div class="wrap"><h2>상담도 이렇게 진행해요.</h2><p class="sub">지원사업 탐색을 시작으로 실제 상품 상담까지 이어집니다.</p><div class="cards">${[['01','관심 분야 선택','자금·시설·마케팅 등'],['02','사업장 기본 진단','지역·업종·창업 단계'],['03','지원사업 후보 확인','공고·자격·지원 유형'],['04','도움 방식 선택','직접 신청 또는 상담'],['05','운영 서비스 제안','마케팅·기기·비용절감'],['06','진행·결과 확인','신청·선정·수혜·후속관리']].map(x=>`<div class="card"><span class="num">${x[0]}</span><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div></div></section>`}
function renderBenefits(){const active=groups.find(x=>x.id===state.group);const sectors=active?active.items:groups.flatMap(x=>x.items);const filtered=programs.filter(p=>(!active||active.items.includes(p.cat))&&(state.sector==='all'||p.cat===state.sector)&&(state.region==='전국'||p.area.includes(state.region)||p.area.includes('전국')));return `<section class="section band"><div class="wrap"><span class="eyebrow">STEP 01 · 혜택 찾아 받기</span><h2 style="margin-top:18px">정부지원사업, 분야별로 살펴봐요.</h2><p class="sub">정책자금부터 POS·시설 지원, 마케팅, 인건비까지. 15개 연구분야를 6개 주제로 묶었어요.</p><div class="cards">${groups.map((g,i)=>`<button class="card" onclick="state.group='${g.id}';state.sector='all';render()" style="${state.group===g.id?'border-color:#325feb;box-shadow:0 0 0 2px #eaf0ff':''}"><span class="num">0${i+1}</span><strong>${g.name}</strong><span>${g.desc}</span></button>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="two"><aside class="panel"><div class="label">지원 분야</div><button class="sidebtn ${state.group==='all'?'active':''}" onclick="state.group='all';state.sector='all';render()">전체 분야 (15개)</button>${groups.map(x=>`<button class="sidebtn ${state.group===x.id?'active':''}" onclick="state.group='${x.id}';state.sector='all';render()">${x.name}</button>`).join('')}<div class="divider"></div><div class="small">정부지원사업과 페이플레이 유료 서비스는 서로 다른 상품이에요. 이 화면의 공고는 보고서에 수록된 조사 사례입니다.</div></aside><div><h2>${active?active.name:'지원사업 전체 분야'}</h2><p class="sub">${active?active.desc:'내 사업에 필요한 지원 유형을 먼저 알아보세요.'}</p><div class="filters"><button class="${state.sector==='all'?'active':''}" onclick="state.sector='all';render()">전체 보기</button>${sectors.map(c=>`<button class="${state.sector===c?'active':''}" onclick="state.sector='${c}';render()">${c}</button>`).join('')}</div><div class="boxblue"><strong>사업장 지역을 선택해 보세요</strong><div class="inputs" style="margin-top:14px"><label class="field">지역<select onchange="state.region=this.value;render()">${['전국','서울','인천','충남','충북','부산','강원'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select></label><div style="grid-column:span 2;align-self:end;color:#4e5968;font-size:13px">조건 검색은 시연용 단순 필터예요. 실제 적격성 판정이 아닙니다.</div></div></div><h3 style="margin:29px 0 14px">${filtered.length}건의 조사 사례 · <span style="font-weight:450;color:var(--gray);font-size:14px">현재 접수 가능한 공고로 확정한 목록이 아니에요.</span></h3><div class="results">${filtered.length?filtered.map(p=>`<article class="result"><span class="tag blue">${p.kind}</span> <span class="tag">${p.area}</span><h3>${p.name}</h3><p>${p.desc}</p><div class="small">${p.status} · ${p.deadline}</div><div class="actionrow"><button class="linkbtn" onclick="openDetail('${p.id}')">상세 보기 →</button><label class="selection"><input type="checkbox" ${state.selected.includes(p.id)?'checked':''} onchange="toggleItem('${p.id}')">관심 담기</label></div></article>`).join(''):'<div class="detail" style="grid-column:1/-1">현재 선택한 조건에 표시할 조사 사례가 없습니다. 공고가 없다는 뜻은 아니며, 실제 수집 API는 아직 연결되지 않았어요.</div>'}</div><div class="actionrow"><span class="small">관심 담은 공고: ${state.selected.length}건</span>${btn('사업장 조건 입력하고 상담하기 →',"openPage('consult')")}</div></div></div></div></section>`}
function openDetail(id){state.detail=id;state.page='detail';render();window.scrollTo(0,0)}
function renderDetail(){const p=programs.find(p=>p.id===state.detail)||programs[0];return `<section class="section band"><div class="wrap"><button class="back" onclick="openPage('benefits')">← 지원사업 목록</button><div class="panel" style="max-width:850px;margin:20px auto"><span class="eyebrow">${p.kind} · ${p.cat}</span><h2 style="margin-top:24px">${p.name}</h2><p class="sub">${p.desc}</p><div class="detail"><div><strong>지원 범위</strong><p>${p.area}</p></div><div><strong>조사 기준 일정</strong><p>${p.deadline}</p></div><div><strong>근거·검증 상태</strong><p>${p.source} · ${p.status}</p></div></div><h3>이런 순서로 도움받을 수 있어요</h3>${['사업장 조건 확인','공식 공고 원문·첨부 확인','신청 준비·서류 체크','공식 신청·접수 확인','선정·미선정 확인','실제 지급·서비스 수혜 기록'].map((x,i)=>`<div class="stage"><h3>${i+1}. ${x}</h3><p>실제 대상 여부와 신청 결과는 공식 기관 기준으로 확인해요.</p></div>`).join('')}<div class="actionrow"><button class="pill ghost" onclick="toggleItem('${p.id}');toast('관심 목록을 수정했어요')">관심 등록/해제</button><a class="pill ghost" target="_blank" rel="noopener" href="${p.url}" style="text-decoration:none">공식 출처 열기 ↗</a>${btn('상담 이어가기 →',"openPage('consult')")}</div></div></div></section>`}
function renderServices(){return `<section class="section band"><div class="wrap"><span class="eyebrow">STEP 04 · 선택 가능한 부가서비스</span><h2 style="margin-top:18px">매장에 필요한 것도 한 곳에서.</h2><p class="sub">지원 혜택을 먼저 살펴보고, 필요한 장비와 서비스는 별도로 선택할 수 있어요.</p><div class="cards">${catalog.map((p,i)=>`<div class="card"><span class="num">0${i+1}</span><strong>${p[0]}</strong><span>${p[1]}</span><div style="margin-top:auto;padding-top:14px"><button class="linkbtn" onclick="addCart(${i})">내 관심상품 담기 →</button></div></div>`).join('')}</div><div class="actionrow"><span class="small">선택한 서비스 ${state.cart.length}개 · 가격·혜택은 연구안이며 공급조건 확인 전입니다.</span>${btn('선택한 서비스 상담하기 →',"openPage('consult')")}</div></div></section>`}
function addCart(i){state.cart=state.cart.includes(i)?state.cart.filter(x=>x!==i):[...state.cart,i];toast(state.cart.includes(i)?'관심상품에 담았어요':'관심상품에서 뺐어요')}
function renderConsult(){const f=state.flow;return `<section class="section band"><div class="wrap" style="max-width:960px"><span class="eyebrow">상담 시연 · ${f+1} / 5 단계</span><h2 style="margin-top:20px">사장님 매장에 맞춰 함께 살펴봐요.</h2><p class="sub">영업사원과 함께 사용할 수도 있고, 직접 선택해 볼 수도 있어요.</p><div class="steps">${['사업장 확인','관심 분야','지원 후보','서비스 선택','상담 정리'].map((x,i)=>`<span class="step ${i===f?'now':''}">${i+1} ${x}</span>`).join('')}</div><div class="panel">${f===0?`<h2>어떤 매장을 운영하시나요?</h2><p class="sub">필요한 정보만 선택해 주세요.</p><div class="inputs"><label class="field">운영 단계<select id="stage">${['운영 중','창업 준비','개업 직후','확장·이전','폐업·재기 검토'].map(x=>`<option ${state.stage===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">업종<select id="industry">${['음식점·카페','소매·유통','서비스업','제조·상품판매','기타'].map(x=>`<option ${state.industry===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">지역<select id="region">${['전국','서울','인천','충남','충북','부산','강원'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`:f===1?`<h2>가장 필요한 건 무엇인가요?</h2><p class="sub">관심 주제를 선택하면 관련 지원사업을 살펴볼 수 있어요.</p><div class="cards">${groups.map(g=>`<button class="card" onclick="state.group='${g.id}';state.flow=2;render()"><span class="num">선택</span><strong>${g.name}</strong><span>${g.desc}</span></button>`).join('')}</div>`:f===2?`<h2>관련 지원사업을 확인해 보세요.</h2><p class="sub">관심 분야: ${groups.find(g=>g.id===state.group)?.name||'전체 분야'} · 보고서 조사 사례이며 실시간 확정 공고는 아니에요.</p><div class="results">${programs.filter(p=>!groups.find(g=>g.id===state.group)||groups.find(g=>g.id===state.group).items.includes(p.cat)).slice(0,4).map(p=>`<div class="result"><span class="tag">${p.kind}</span><h3>${p.name}</h3><p>${p.status} · ${p.area}</p><label class="selection"><input type="checkbox" ${state.selected.includes(p.id)?'checked':''} onchange="toggleItem('${p.id}')"> 관심 담기</label></div>`).join('')}</div><div class="actionrow">${btn('전체 지원사업 더 보기',"openPage('benefits')",'pill ghost')}</div>`:f===3?`<h2>어떤 방식으로 도움받을까요?</h2><p class="sub">공식 정보를 직접 확인하거나, 필요한 운영 서비스에 대해서만 상담받을 수 있어요.</p><div class="results"><button class="card" onclick="state.serviceType='직접 알아보기';state.flow=4;render()"><span class="num">A</span><strong>직접 알아보고 신청하기</strong><span>공고 원문과 준비 목록을 보고 직접 진행해요.</span></button><button class="card" onclick="state.serviceType='전문가·운영 상담';state.flow=4;render()"><span class="num">B</span><strong>전문가·운영 서비스 상담</strong><span>지원사업 준비와 경영·마케팅·매장 서비스에 대해 상담해요.</span></button></div><div class="boxblue" style="margin-top:20px">기존에 논의한 개별 자문형·월 구독형은 연구 중인 과금 모델로, 현재는 확정 가격을 표시하지 않아요.</div>`:`<h2>상담 내용을 정리했어요.</h2><p class="sub">사장님 또는 영업사원이 다음 진행을 확인할 수 있어요.</p><div class="detail"><p><strong>사업장</strong> · ${state.stage} / ${state.industry} / ${state.region}</p><p><strong>관심 분야</strong> · ${groups.find(g=>g.id===state.group)?.name||'전체'}</p><p><strong>선택 방식</strong> · ${state.serviceType||'미선택'}</p><p><strong>관심 공고</strong> · ${state.selected.map(id=>programs.find(x=>x.id===id)?.name).join(', ')||'없음'}</p><p><strong>관심 상품</strong> · ${state.cart.map(i=>catalog[i][0]).join(', ')||'없음'}</p></div><label class="field">상담 메모 (실제 개인정보 입력 금지)<textarea id="memo" rows="3" placeholder="고객의 질문이나 테스트 의견을 적어주세요.">${state.memo||''}</textarea></label><div class="actionrow">${btn('시연 상담 요약 다운로드',"downloadSummary()")}${btn('처음부터 다시 시연',"resetConsult()",'pill ghost')}</div><p class="small">상담 API·로그인·고객 DB는 아직 연결되지 않았습니다. 시연 자료는 파일로만 내려받아요.</p>`}<div class="actionrow"><button class="back" onclick="state.flow=Math.max(0,state.flow-1);render()">${f?'← 이전 단계':'처음 단계'}</button>${f<4&&f!==1&&f!==3?btn('다음 단계 →',"nextFlow()"):''}</div></div></div></section>`}
function nextFlow(){if(state.flow===0){state.stage=document.getElementById('stage').value;state.industry=document.getElementById('industry').value;state.region=document.getElementById('region').value}state.flow=Math.min(4,state.flow+1);render();window.scrollTo(0,0)}
function resetConsult(){state.flow=0;state.selected=[];state.cart=[];state.memo='';render()}
function downloadSummary(){state.memo=document.getElementById('memo')?.value||'';const data={version:'sales-demo-v0.3',type:'시연용 상담 기록',stage:state.stage,industry:state.industry,region:state.region,group:state.group,serviceType:state.serviceType,programs:state.selected.map(id=>programs.find(p=>p.id===id)?.name),services:state.cart.map(i=>catalog[i][0]),memo:state.memo};const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='payplay-demo-consult.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){app.innerHTML=state.page==='home'?renderHome():state.page==='benefits'?renderBenefits():state.page==='detail'?renderDetail():state.page==='services'?renderServices():renderConsult();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page||(state.page==='detail'&&b.dataset.page==='benefits')))}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));render();
</script></body></html>
