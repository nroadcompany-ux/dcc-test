enPage('benefits')",'pill ghost')}</div>`:f===3?`<h2>어떤 방식으로 도움받을까요?</h2><p class="sub">공식 정보를 직접 확인하거나, 필요한 운영 서비스에 대해서만 상담받을 수 있어요.</p><div class="results"><button class="card" onclick="state.serviceType='직접 알아보기';state.flow=4;render()"><span class="num">A</span><strong>직접 알아보고 신청하기</strong><span>공고 원문과 준비 목록을 보고 직접 진행해요.</span></button><button class="card" onclick="state.serviceType='전문가·운영 상담';state.flow=4;render()"><span class="num">B</span><strong>전문가·운영 서비스 상담</strong><span>지원사업 준비와 경영·마케팅·매장 서비스에 대해 상담해요.</span></button></div><div class="boxblue" style="margin-top:20px">기존에 논의한 개별 자문형·월 구독형은 연구 중인 과금 모델로, 현재는 확정 가격을 표시하지 않아요.</div>`:`<h2>상담 내용을 정리했어요.</h2><p class="sub">사장님 또는 영업사원이 다음 진행을 확인할 수 있어요.</p><div class="detail"><p><strong>사업장</strong> · ${state.stage} / ${state.industry} / ${state.region}</p><p><strong>관심 분야</strong> · ${groups.find(g=>g.id===state.group)?.name||'전체'}</p><p><strong>선택 방식</strong> · ${state.serviceType||'미선택'}</p><p><strong>관심 공고</strong> · ${state.selected.map(id=>programs.find(x=>x.id===id)?.name).join(', ')||'없음'}</p><p><strong>관심 상품</strong> · ${state.cart.map(i=>prodName(i)).join(', ')||'없음'}</p></div><label class="field">상담 메모 (실제 개인정보 입력 금지)<textarea id="memo" rows="3" placeholder="고객의 질문이나 테스트 의견을 적어주세요.">${state.memo||''}</textarea></label><div class="actionrow">${btn('상담 신청 기록 저장 (시연)',"saveFlowRecord()")}${btn('시연 상담 요약 다운로드',"downloadSummary()")}${btn('처음부터 다시 시연',"resetConsult()",'pill ghost')}</div><p class="small">상담 API·로그인·고객 DB는 아직 연결되지 않았습니다. 시연 자료는 파일로만 내려받아요.</p>`}<div class="actionrow"><button class="back" onclick="state.flow=Math.max(0,state.flow-1);render()">${f?'← 이전 단계':'처음 단계'}</button>${f<4&&f!==1&&f!==3?btn('다음 단계 →',"nextFlow()"):''}</div></div></div></section>`}

let benefitExpanded={policy:false,tax:false,manage:false};
function benefitCardSection(id){
 const group=benefitLabels[id]; if(!group)return '';
 const expanded=!!benefitExpanded[id];
 const cards=group.entries.slice(0,expanded?7:3).map((e,i)=>`<button class="benefit-card" type="button" onclick="benefitDetail('${id}',${i})"><span class="benefit-label">${esc(e[0])}</span><span class="benefit-money">${esc(e[1])}</span><span class="benefit-context">${esc(e[2])}</span><span class="benefit-basis">${esc(e[3])}</span></button>`).join('');
 const headline=id==='policy'?`<div class="money-types"><div class="money-type"><b>환급·지원금</b><span>진단 후 확인 · 비상환 혜택</span></div><div class="money-type"><b>정책자금·보증</b><span>융자 한도는 공식 공고에서 확인 · 상환조건 있음</span></div><div class="money-type"><b>연간 비용절감</b><span>우리 매장 진단 후 확인</span></div></div>`:'';
 return `<div class="benefit-intro"><h3>사장님이 확인할 수 있는 혜택</h3>${headline}<p class="muted">${esc(group.description)}</p><div class="benefit-grid" id="benefits-${id}">${cards}</div><button type="button" class="benefit-more" aria-expanded="${expanded}" aria-controls="benefits-${id}" onclick="toggleBenefit('${id}')">${expanded?'− 접기':'+ 혜택 4개 더 보기'}</button><div class="benefit-disclaimer">${esc(group.note)}</div></div>`;
}

function toggleBenefit(id){const y=window.scrollY;benefitExpanded[id]=!benefitExpanded[id];render();window.scrollTo({top:y,behavior:'instant'})}
function benefitDetail(id,i){const g=benefitLabels[id],e=g&&g.entries[i];if(!e)return;openDrawer(`<div class="between"><span class="eyebrow">혜택 안내 · ${esc(e[3])}</span><button class="pill ghost" onclick="closeDrawer()">닫기</button></div><h2 style="margin-top:22px">${esc(e[0])}</h2><div class="benefit-intro"><div class="benefit-money" style="font-size:22px;font-weight:900;color:#2854d8">${esc(e[1])}</div><p>${esc(e[2])}</p></div><div class="qa-note">${esc(g.note)} 신청 가능 여부와 세부 기준은 공식 공고·전문가를 통해 확인하세요.</div><div class="actionrow"><button class="pill" onclick="closeDrawer();benefitCTA('${id}')">${esc(g.cta)}</button></div>`)}
function benefitCTA(id){if(id==='policy')openProgramSearch();else if(id==='tax')openConsult('refund');else setPurpose('save')}
function svcBlock(s){const grid='<h3 class="rtitle">연결 가능한 서비스 6개 <span class="small">문제 → 해결 서비스</span></h3><div class="rgrid">'+s.cards.map(roadCard).join('')+'</div>';return benefitLabels[s.id]?'<details class="svcdetails"><summary>연결 서비스 6개 보기 (문제 → 해결 서비스)</summary>'+grid+'</details>':grid}

function openRoadStage(i){openPage('road');requestAnimationFrame(()=>{const el=document.getElementById('stage-'+i);if(el)el.scrollIntoView({block:'start'})})}
function roadCard(c){const x=prod(c[0]);if(!x)return '';const on=state.cart.includes(x[0]);return `<article class="rcard"><div class="rprob"><span class="rl">고객 문제</span>${esc(c[1])}</div><div class="rsol"><span class="rarrow" aria-hidden="true">→</span><div><span class="rl">해결 서비스</span><strong>${esc(c[3]||x[1])}</strong><p>${esc(c[2])}</p></div></div><div class="pbtn"><button class="linkbtn" onclick="detailItem('${x[0]}')">상세보기</button><button class="linkbtn" onclick="toggleCart('${x[0]}')">${on?'담기 취소':'관심상품 담기'}</button><button class="linkbtn" onclick="consultItem('${x[0]}')">상담 신청</button></div></article>`}
function refundBlock(){return `<div class="taxbox"><h3>경정청구 서비스 소개</h3><p>이미 신고한 세금이 과다하게 계산된 경우, 신고 내용을 바로잡아 낸 세금의 환급을 청구하는 절차입니다. 일반적으로 법정신고기한이 지난 뒤 5년 이내에 청구할 수 있으며, 실제 가능 여부와 금액은 전문가 검토가 필요합니다.</p><h3>환급이 발생할 수 있는 상황</h3><ul class="chk">${refundSituations.map(s=>`<li>${s}</li>`).join('')}</ul><h3>가상 환급 사례 3건 <span class="badge demo">DEMO</span></h3><p class="small">아래 사례는 화면 설명용 가상 데이터이며 실제 고객 성과가 아닙니다. 금액은 확정된 환급금이 아닙니다.</p><div class="cases">${refundCases.map((c,i)=>`<div class="casebox"><span class="badge demo">DEMO · 가상 사례 ${i+1}</span><strong>${c[0]}</strong><p><b>상황</b> ${c[1]}</p><p><b>검토 포인트</b> ${c[2]}</p><p><b>환급 후보(가상)</b> <span class="amt">${c[3]}</span></p></div>`).join('')}</div><div class="actionrow"><button class="pill" onclick="openConsult('refund')">나도 환급금 조회하기 →</button><span class="small">환급금을 확정해 조회하는 기능이 아닙니다. 사업장 조건을 남기면 환급 가능성을 검토하는 상담·검토 신청(시연)으로 연결됩니다.</span></div></div>`}
function renderRoad(){return `<section class="section band"><div class="wrap road"><span class="eyebrow">02 · 영업 로드맵</span><h1 class="h1s">고객 문제에서 시작하는 5단계</h1><p class="sub">각 단계는 고객이 겪는 문제, 해결 방향, 연결 가능한 서비스 6개로 구성됩니다. 서비스 카드는 서비스 찾아보기와 같은 상품 목록을 사용합니다.</p><div class="filters" aria-label="로드맵 단계 바로가기">${roadmap.map((s,i)=>`<button onclick="openRoadStage(${i})">${i+1}단계 ${s.title}</button>`).join('')}</div>${roadmap.map((s,i)=>`<section class="stagebox" id="stage-${i}" aria-labelledby="st-${i}"><div class="stagehead"><span class="snum">${i+1}</span><div><span class="eyebrow">${i+1}단계 / 5단계</span><h2 id="st-${i}" style="margin:8px 0 0">${s.title}</h2></div></div><div class="duo"><div class="pbox"><div class="label">고객이 겪는 문제</div><p>${s.problem}</p></div><div class="pbox blue"><div class="label">문제 해결 방향</div><p>${s.direction}</p></div></div><p class="small">진행 순서 · ${s.flow}</p>${benefitCardSection(s.id)}${s.id==='tax'?refundBlock():''}${svcBlock(s)}<div class="actionrow">${s.id==='policy'?btn('지원사업·혜택 검색 열기 →',"openProgramSearch()"):btn('상품 목록에서 더 보기',"setPurpose('"+(s.id==='tax'?'expert':s.id==='digital'?'buy':s.id==='growth'?'growth':'save')+"')",'pill ghost')}<button class="pill ghost" onclick="openConsult('wish')">관심 상품·상담</button></div></section>`).join('')}</div></section>`}

function toggleSide(){state.sideOpen=!state.sideOpen;store.set('pp-sb-side',state.sideOpen);keepBenefitPosition(()=>{})}
function syncTbl(){const t=document.getElementById('tbl'),r=document.getElementById('tblrange');if(t&&r)r.value=t.scrollWidth>t.clientWidth?Math.round(t.scrollLeft/(t.scrollWidth-t.clientWidth)*100):0}
function rangeTbl(v){const t=document.getElementById('tbl');if(t)t.scrollLeft=(t.scrollWidth-t.clientWidth)*Number(v)/100}
function moveTbl(d){const t=document.getElementById('tbl');if(t){t.scrollBy({left:d*Math.max(320,t.clientWidth*.6),behavior:'smooth'});setTimeout(syncTbl,450)}}
function openAlertPanel(){if(state.page!=='benefits'){state.page='benefits';pushNav();render()}requestAnimationFrame(()=>{const e=document.getElementById('alertpanel');if(e){e.scrollIntoView({block:'start'});const f=e.querySelector('input,select');if(f)f.focus({preventScroll:true})}})}
function interestMatches(){const gs=groups.filter(g=>state.interest.groups.includes(g.id)),cats=gs.flatMap(g=>g.items),r=state.interest.region;return programs.filter(p=>cats.includes(p.cat)&&(r==='전국'||p.area.includes(r)||p.area.includes('전국'))&&p.recruitmentStatus!=='종료')}
function toggleInterest(id,on){const a=state.interest.groups.filter(x=>x!==id);if(on)a.push(id);state.interest.groups=a;keepBenefitPosition(()=>{})}
function setInterestField(k,v){state.interest[k]=v;keepBenefitPosition(()=>{})}
function saveInterest(){store.set('pp-sb-interest',state.interest);toast('관심 분야를 이 브라우저에 저장했어요. 실제 알림 발송은 아직 연결되지 않았습니다.')}
function renderAlertPanel(){const it=state.interest,m=interestMatches(),top=m.slice().sort((a,b)=>(a.endDate&&/^\d{4}-/.test(a.endDate)?a.endDate:'9999-12-31').localeCompare(b.endDate&&/^\d{4}-/.test(b.endDate)?b.endDate:'9999-12-31')).slice(0,5);
return `<section class="section band" id="alertpanel"><div class="wrap"><span class="eyebrow">내 사업장 맞춤 혜택 알림</span><h2 style="margin-top:18px">관심 분야를 고르면 맞는 공고를 모아 보여드려요.</h2><p class="sub">시연 기능입니다. 선택값은 이 브라우저에만 저장되며 로그인·실시간 API·알림 발송은 아직 연결되지 않았습니다.</p><div class="panel"><div class="label">관심 분야 (복수 선택)</div><div class="checkgrid">${groups.map(g=>`<label class="selection"><input type="checkbox" ${it.groups.includes(g.id)?'checked':''} onchange="toggleInterest('${g.id}',this.checked)"> ${g.name}</label>`).join('')}</div><div class="inputs" style="margin-top:14px"><label class="field">지역<select aria-label="맞춤 알림 지역" onchange="setInterestField('region',this.value)">${REGIONS.map(x=>`<option ${it.region===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">업종<select aria-label="맞춤 알림 업종" onchange="setInterestField('industry',this.value)">${['음식점·카페','소매·유통','서비스업','제조·상품판매','기타'].map(x=>`<option ${it.industry===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="divider"></div>${it.groups.length?`<p><strong>맞춤 후보 ${m.length}건</strong> <span class="small">(종료 제외 · 마감 임박순 상위 ${top.length}건)</span></p><div class="results">${top.map(p=>`<div class="result"><span class="badge ${p.isDemo?'demo':'real'}">${p.isDemo?'DEMO':'실제'}</span> <span class="tag">${p.cat}</span><h3>${p.name}</h3><p>${p.recruitmentStatus} · ${p.area} · ${p.startDate||'확인필요'} ~ ${p.endDate||'확인필요'}</p><button class="linkbtn" onclick="openDetail('${p.id}')">상세 보기 →</button></div>`).join('')}</div>`:'<p class="small">관심 분야를 하나 이상 선택해 주세요.</p>'}<div class="actionrow"><button class="pill" onclick="saveInterest()">관심 분야 저장 (시연)</button><span class="small">저장하면 이 브라우저에서 다시 열 때 선택이 유지됩니다.</span></div></div></div></section>`}
function renderBenefitsPage(){return `<section class="section" style="padding-bottom:0"><div class="wrap"><div class="filters" style="margin-bottom:0"><button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">전체 공고 목록</button><button onclick="openAlertPanel()">내 사업장 맞춤 혜택 알림</button><button onclick="document.getElementById('portals').scrollIntoView({block:'center'})">공식 신청처</button></div></div></section>${renderBenefitsList()}<section class="section" id="portals"><div class="wrap"><h3>공식 신청처</h3><p class="sub" style="margin-bottom:12px">공고별 신청은 공식 기관에서 직접 진행합니다. 아래는 공고를 확인할 수 있는 공식 포털입니다.</p><div class="downloadbar" style="margin:0"><div style="display:flex;gap:8px;flex-wrap:wrap">${PORTALS.map(x=>`<a class="filelink" target="_blank" rel="noopener noreferrer" href="${x[1]}">${x[0]} ↗</a>`).join('')}</div></div></div></section>${renderAlertPanel()}`}
function togglePrep(id,i,on){const all=store.get('pp-sb-prep',{})||{};const a=(all[id]||[]).filter(x=>x!==i);if(on)a.push(i);all[id]=a;store.set('pp-sb-prep',all)}
function savePrep(id){const p=programs.find(x=>x.id===id);if(!p)return;addRecord('신청 준비',(p.isDemo?'[DEMO] ':'')+p.name);toast('신청 준비를 시연 기록으로 남겼어요. 실제 접수는 진행되지 않았습니다.')}
function prepBlock(p){const chk=(store.get('pp-sb-prep',{})||{})[p.id]||[];return `<div class="prepbox" id="prep"><h3 style="margin-top:0">신청 준비</h3><p class="small" style="font-size:13px">${p.isDemo?'DEMO 공고라 실제 신청처가 없습니다. 신청 준비 흐름을 확인하는 용도로만 사용하세요.':'아래 항목을 확인한 뒤 공식 신청처에서 직접 신청합니다. 이 화면은 실제 접수가 아닙니다.'}</p>${PREP_STEPS.map((x,i)=>`<label class="selection"><input type="checkbox" ${chk.includes(i)?'checked':''} onchange="togglePrep('${p.id}',${i},this.checked)"> ${x}</label>`).join('')}<div class="actionrow" style="margin-top:12px"><button class="pill" onclick="savePrep('${p.id}')">신청 준비 기록 저장 (시연)</button><div style="display:flex;gap:8px;flex-wrap:wrap">${PORTALS.map(x=>`<a class="filelink" target="_blank" rel="noopener noreferrer" href="${x[1]}">${x[0]} ↗</a>`).join('')}</div></div></div>`}
/* ---------- 04 관심 상품·상담 ---------- */
function setCTab(t){state.ctab=t;pushNav();render()}
function consultTabs(){return `<section class="section" style="padding-bottom:0"><div class="wrap"><span class="eyebrow">04 · 관심 상품·상담</span><h2 style="margin:16px 0">관심 상품과 상담 진행</h2><div class="filters" role="tablist" aria-label="상담 메뉴" style="margin-bottom:0">${CTABS.map(t=>`<button role="tab" aria-selected="${state.ctab===t[0]}" class="${state.ctab===t[0]?'active':''}" onclick="setCTab('${t[0]}')">${t[1]}${t[0]==='wish'&&state.cart.length?` (${state.cart.length})`:''}${t[0]==='status'&&getRecords().length?` (${getRecords().length})`:''}</button>`).join('')}</div></div></section>`}
function wrapTab(inner){return `<section class="section band"><div class="wrap" style="max-width:960px">${inner}</div></section>`}
function renderWish(){const pl=state.selected.map(id=>programs.find(p=>p.id===id)).filter(Boolean);return wrapTab(`<div class="panel"><h3 style="margin-top:0">관심 상품 ${state.cart.length}개</h3>${state.cart.length?state.cart.map(id=>{const x=prod(id);return `<div class="selrow"><div><strong>${esc(x[1])}</strong><div class="small">${esc(labelType(x[2]))} · ${esc(x[4])}</div></div><div class="pbtn"><button class="linkbtn" onclick="detailItem('${id}')">상세보기</button><button class="linkbtn" onclick="removeCart('${id}')">삭제</button></div></div>`}).join(''):'<div class="detail">아직 담은 상품이 없어요. 서비스 찾아보기나 영업 로드맵에서 관심 상품을 담아 보세요.</div>'}<div class="actionrow">${btn('서비스 찾아보기',"openPage('services')",'pill ghost')}${btn('영업 로드맵',"openPage('road')",'pill ghost')}${state.cart.length?btn('비교·견적으로 →',"setCTab('compare')"):''}</div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">관심 공고 ${pl.length}건</h3>${pl.length?pl.map(p=>`<div class="selrow"><div><strong>${p.name}</strong><div class="small">${p.isDemo?'DEMO':'실제'} · ${p.cat} · ${p.recruitmentStatus}</div></div><div class="pbtn"><button class="linkbtn" onclick="openDetail('${p.id}')">상세보기</button><button class="linkbtn" onclick="toggleItem('${p.id}')">삭제</button></div></div>`).join(''):'<div class="detail">지원사업·혜택 검색에서 공고를 열어 관심 등록할 수 있어요.</div>'}<div class="actionrow">${btn('지원사업·혜택 검색',"openProgramSearch()",'pill ghost')}</div></div>`)}
function requestQuote(){const ids=[...document.querySelectorAll('.qchk:checked')].map(x=>x.value);if(!ids.length){toast('견적을 요청할 상품을 하나 이상 선택해 주세요');return}addRecord('견적 요청',ids.map(prodName).join(', '));toast('견적 요청을 시연 기록으로 남겼어요. 실제 견적이 발송되지는 않습니다.');state.ctab='status';pushNav();render();window.scrollTo(0,0)}
function renderCompare(){if(!state.cart.length)return wrapTab(`<div class="panel"><h3 style="margin-top:0">비교·견적</h3><div class="detail">비교할 관심 상품이 없어요. 상품을 담으면 유형·분류·조건을 나란히 비교할 수 있어요.</div><div class="actionrow">${btn('서비스 찾아보기 →',"openPage('services')")}</div></div>`);
return wrapTab(`<div class="panel"><h3 style="margin-top:0">비교·견적</h3><p class="sub">담아 둔 상품을 비교하고 견적을 요청할 상품을 고르세요. 가격은 확정 전이며 연구 예시가 있는 경우 설명에 함께 표시됩니다.</p><div class="tablewrap"><table class="data-table" style="min-width:680px"><thead><tr><th>견적</th><th>상품</th><th>유형</th><th>분류</th><th>설명·조건</th></tr></thead><tbody>${state.cart.map(id=>{const x=prod(id);return `<tr><td><input class="qchk" type="checkbox" value="${id}" checked aria-label="${esc(x[1])} 견적 요청"></td><td><strong>${esc(x[1])}</strong></td><td>${esc(labelType(x[2]))}</td><td>${esc(x[4])}</td><td style="min-width:220px">${esc(x[5])}<div class="small">실제 가격·공급조건 확인 필요</div></td></tr>`}).join('')}</tbody></table></div><div class="actionrow"><button class="pill" onclick="requestQuote()">선택 상품 견적 요청 (시연)</button><span class="small">시연 기록만 남으며 실제 견적서가 발송되지 않습니다.</span></div></div>`)}
function submitRefund(){const g=id=>document.getElementById(id).value,chk=[...document.querySelectorAll('.rchk:checked')].map(x=>x.value);if(!state.cart.includes('T01'))state.cart=[...state.cart,'T01'];addRecord('환급 검토 요청',`${g('rf-ind')} / 운영 ${g('rf-yrs')} / ${g('rf-how')} / 검토 항목: ${chk.join(', ')||'미선택'}`);toast('환급 검토 요청을 시연 기록으로 남겼어요. 환급금이 조회·확정된 것은 아닙니다.');state.ctab='status';pushNav();render();window.scrollTo(0,0)}
function renderRefund(){return wrapTab(`<div class="panel"><h3 style="margin-top:0">환급금 조회 요청</h3><div class="qa-note">이 화면은 환급금을 확정해 조회하는 기능이 아닙니다. 사업장 조건을 남기면 환급 가능성을 검토하는 상담·검토 신청 흐름(시연)으로 기록됩니다. 실제 사업자번호·개인정보는 입력하지 마세요.</div><div class="inputs" style="margin-top:16px"><label class="field">업종<select id="rf-ind">${['음식점·카페','소매·유통','서비스업','제조·상품판매','기타'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">운영 기간<select id="rf-yrs">${['1년 미만','1~3년','3~5년','5년 이상'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">신고 방식<select id="rf-how">${['세무사 기장','직접 신고','잘 모름'].map(x=>`<option>${x}</option>`).join('')}</select></label></div><div class="label" style="margin-top:16px">검토 받고 싶은 항목</div><div class="checkgrid">${['공제·감면','필요경비','매입세액','고용·보험료 혜택','기타'].map(x=>`<label class="selection"><input class="rchk" type="checkbox" value="${x}"> ${x}</label>`).join('')}</div><div class="actionrow"><button class="pill" onclick="submitRefund()">환급 검토 요청 (시연)</button>${btn('경정청구 소개 보기',"openRoadStage(1)",'pill ghost')}</div></div>`)}
function saveFlowRecord(){state.memo=(document.getElementById('memo')||{}).value||'';const ps=state.selected.map(id=>(programs.find(p=>p.id===id)||{}).name).filter(Boolean);addRecord('상담 신청',`${state.stage} / ${state.industry} / ${state.region} · 관심 분야 ${(groups.find(g=>g.id===state.group)||{}).name||'전체'} · 공고 ${ps.length}건 · 상품 ${state.cart.length}개`);toast('상담 신청을 시연 기록으로 남겼어요. 실제 접수는 진행되지 않았습니다.');state.ctab='status';pushNav();render();window.scrollTo(0,0)}
function renderStatus(){const rs=getRecords(),steps=['접수','검토','상담','결과 안내'];return wrapTab(`<div class="panel"><h3 style="margin-top:0">상담 및 진행 상태</h3><p class="sub">이 브라우저에 저장된 시연 기록입니다. 실제 상담 접수·로그인·고객 DB는 아직 연결되지 않았으며, 상태는 자동으로 바뀌지 않습니다.</p>${rs.length?rs.map(r=>`<div class="selrow" style="align-items:flex-start"><div><span class="badge demo">DEMO</span> <strong>${esc(r.type)}</strong><div class="small">${esc(r.summary)}</div><div class="small">${esc(r.date)} · ${esc(r.status)}</div><div class="steps" style="margin:8px 0 0">${steps.map((s,i)=>`<span class="step ${i===0?'now':''}">${i+1} ${s}</span>`).join('')}</div></div></div>`).join(''):'<div class="detail">아직 기록이 없어요. 상담 신청, 환급 검토 요청, 견적 요청을 하면 여기에 표시됩니다.</div>'}<div class="actionrow">${btn('상담 신청 하기',"setCTab('flow')",'pill ghost')}${rs.length?`<button class="back" onclick="clearRecords()">기록 모두 지우기</button>`:''}</div></div>`)}
function renderConsultPage(){const t=state.ctab;return consultTabs()+(t==='wish'?renderWish():t==='compare'?renderCompare():t==='refund'?renderRefund():t==='status'?renderStatus():renderConsultFlow())}
/* ---------- render ---------- */
function render(){
  const fn={home:renderHome,services:renderServices,road:renderRoad,benefits:renderBenefitsPage,detail:renderDetail,consult:renderConsultPage}[state.page]||renderHome;
  app.innerHTML=fn();
  document.querySelectorAll('[data-page]').forEach(b=>{const on=b.dataset.page===state.page||(state.page==='detail'&&b.dataset.page==='benefits');b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const cc=document.getElementById('cartcount');if(cc){cc.textContent=state.cart.length;cc.hidden=!state.cart.length}
  store.set('pp-sb-cart',state.cart);store.set('pp-sb-selected',state.selected);setHdr();
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
applyHash();try{history.replaceState({n:0},'',hashOf())}catch(e){}

</script></body></html>
