<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NROAD DCC · 2단 탐색 시안</title><style>
:root{--blue:#325feb;--ink:#191f28;--muted:#64748b;--edge:#e3e8f0;--light:#f5f7fb;--navy:#163152}*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#fff}
header{height:65px;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid var(--edge);background:#fff}
header strong{font-size:22px;letter-spacing:-.5px}header small{color:var(--muted)}header a{margin-left:auto;color:var(--blue);text-decoration:none;font-weight:700}
.shell{display:grid;grid-template-columns:214px 235px minmax(0,1fr);height:calc(100vh - 65px);min-height:500px}
aside{overflow-y:auto;padding:19px 12px}.primary{background:#173454;color:#e8efff}.secondary{background:#f6f8fb;border-right:1px solid var(--edge)}
.meta{font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.65;margin:8px 10px 15px}
.navitem,.subitem{display:flex;align-items:center;width:100%;text-align:left;border:0;border-radius:9px;background:transparent;padding:13px 12px;cursor:pointer;font-size:14px;font-weight:700;gap:10px}
.navitem{color:#e8efff}.navitem.active{background:#375a80;color:#fff}.subitem{color:#42536a}.subitem.active{background:#e7eeff;color:#2858e8}
.num{min-width:23px;font-size:11px;opacity:.7}.group{font-size:12px;font-weight:800;color:#8591a2;padding:14px 11px 8px}
.workspace{min-width:0;display:flex;flex-direction:column}
.toolbar{height:57px;padding:12px 22px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:12px;background:white}
.toolbar span{font-size:13px;color:var(--muted)}.toolbar strong{font-size:16px}.toolbar button{margin-left:auto;border:1px solid #c8d7ff;color:var(--blue);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}
.frame{flex:1;width:100%;border:0;min-height:0}.blank{padding:36px;line-height:1.7;max-width:720px}.blank p{color:var(--muted)}.blank a{color:var(--blue)}
.collapsed{grid-template-columns:68px 235px minmax(0,1fr)}.collapsed .primary .label,.collapsed .primary .meta{display:none}
.toggle{border:1px solid #c1d1e7;border-radius:8px;background:transparent;color:#e8efff;padding:8px;margin:8px;cursor:pointer}
@media(max-width:900px){.shell{grid-template-columns:155px minmax(0,1fr)}.secondary{display:none}.collapsed{grid-template-columns:68px minmax(0,1fr)}}
@media(max-width:620px){.shell{grid-template-columns:60px minmax(0,1fr)}.primary .label,.primary .meta{display:none}.toolbar{padding:9px}}
</style><style>
.quickwrap{padding:26px;overflow:auto;height:100%;background:#f6f8fc}.quickhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.quickhead h1{font-size:25px;margin:0 0 5px}.quickhead p{margin:0;color:#65748a}.quickbtn{border:1px solid #bfd0fa;border-radius:10px;background:#fff;color:#325feb;padding:10px 14px;cursor:pointer;font-weight:800}.quickbtn.primary{background:#325feb;color:white}.quickgrp{margin-top:22px}.quickgrphead{display:flex;gap:8px;align-items:center;margin-bottom:10px}.quickgrphead h2{font-size:16px;margin:0;flex:1}.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quickcard{background:white;border:1px solid #dfe5f1;border-radius:15px;padding:17px;min-width:0}.quickcard a{color:#153eb1;font-weight:800;word-break:break-all;text-decoration:none}.quickcard p{font-size:12px;color:#718096;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quickcard .actions{display:flex;gap:8px}.quickcard .actions button{font-size:12px;padding:6px 9px;border:1px solid #e2e9f5;background:white;border-radius:7px;cursor:pointer}.quickmodal{position:fixed;inset:0;z-index:1000;background:#111c3766;display:none;align-items:center;justify-content:center;padding:16px}.quickmodal.show{display:flex}.quickdialog{background:white;border-radius:18px;width:min(520px,100%);padding:24px}.quickdialog label{display:block;margin:12px 0;font-size:13px;font-weight:700}.quickdialog input,.quickdialog select,.quickdialog textarea{display:block;width:100%;padding:11px;border:1px solid #d8dfec;border-radius:9px;margin-top:5px;font:inherit}.quickdialog textarea{min-height:76px}.quickdialog .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.quick-search{width:min(340px,100%);border:1px solid #dfe5ef;padding:12px;border-radius:10px;margin-top:17px}@media(max-width:950px){.quickgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.quickgrid{grid-template-columns:1fr}.quickhead{align-items:start;flex-direction:column}}
</style><style>
:root{--blue:#325feb;--ink:#191f28;--muted:#6b7684;--edge:#e5e8eb;--light:#f5f6f8;--navy:#18268a}
.primary{background:#18268a}.navitem.active{background:#325feb}.secondary{background:#f5f6f8}.shell{grid-template-columns:205px 225px minmax(0,1fr)}.shell.collapsed{grid-template-columns:66px 225px minmax(0,1fr)}
.navitem,.subitem{border-radius:12px}.toolbar{gap:9px}.toolbar button{margin-left:0;border-radius:999px}.toolbar button:last-child{margin-left:auto}
.backbtn{width:32px;height:32px;display:grid;place-items:center;padding:0!important;flex-shrink:0}.quickcard,.quickdialog{border-radius:24px;box-shadow:0 1px 2px rgba(25,31,40,.04),0 6px 20px rgba(25,31,40,.05)}.quickbtn{border-radius:999px}.quickwrap{background:#f5f6f8}
@media(max-width:900px){.shell{grid-template-columns:155px minmax(0,1fr)}.shell.collapsed{grid-template-columns:66px minmax(0,1fr)}}
@media(max-width:620px){.shell{grid-template-columns:60px minmax(0,1fr)}.toolbar span{display:none}.toolbar strong{font-size:13px}.toolbar button:last-child{font-size:11px;padding:7px}}
</style>
</head><body>
<header><strong>NROAD DCC</strong><small>프로젝트 통합 관제 · 디자인 통합 검토 v1.0 · WORKING</small><a href="https://nroad-dcc-test.vercel.app/" target="_blank" rel="noopener">기존 DCC 열기 ↗</a></header>
<div class="shell" id="shell"><aside class="primary"><button class="toggle" onclick="toggleBar()" aria-label="첫 번째 사이드바 접기">≡</button><div class="meta">브랜드 · 프로젝트</div><div id="mainnav"></div></aside>
<aside class="secondary"><div class="meta" id="brandname">하위 메뉴</div><div id="subnav"></div></aside>
<section class="workspace"><div class="toolbar"><button class="backbtn" onclick="dccBack()" title="뒤로가기" aria-label="뒤로가기">←</button><button class="backbtn" onclick="selectGroup('nroad')" title="홈" aria-label="홈">⌂</button><strong id="pagetitle">혜택·매장 솔루션</strong><span id="crumb">생존 / 영업 시연</span><button onclick="openPage('benefits')">서비스 홈</button></div><div id="bodybox" class="workspace" style="flex:1"><iframe class="frame" id="demoFrame" src="payplay-benefits.html" title="생존 혜택·매장 솔루션"></iframe></div></section></div>
<script>
const groups=[
{id:'nroad',title:'NROAD',links:[['overview','내 바로가기'],['status','프로젝트 상태']]},
{id:'saengzone',title:'생존 SaengZone',links:[['benefits','혜택·매장 솔루션'],['catalog','6대 목적형 서비스'],['support','정부지원사업'],['road','영업 로드맵']]},
{id:'payplay',title:'PayPlay',links:[['oc','OC 운영관리'],['osp','OSP 영업 플랫폼'],['payplay','PayPlay 제작 허브']]},
{id:'return',title:'RETURN',links:[['return','QA·업데이트 허브']]}];
let group='nroad',current='overview';let navHistory=[];let navLock=false;function dccBack(){let prev=navHistory.pop();if(!prev){selectGroup('nroad');return}navLock=true;group=prev.group;openPage(prev.id);navLock=false}
function toggleBar(){document.getElementById('shell').classList.toggle('collapsed')}
function renderNav(){
document.getElementById('mainnav').innerHTML=groups.map((g,i)=>'<button class="navitem '+(g.id===group?'active':'')+'" onclick="selectGroup(\''+g.id+'\')"><span class="num">'+('0'+(i+1)).slice(-2)+'</span><span class="label">'+g.title+'</span></button>').join('');
let g=groups.find(x=>x.id===group);
document.getElementById('brandname').textContent=g.title+' · 상세 메뉴';
document.getElementById('subnav').innerHTML=g.links.map((l,i)=>'<button class="subitem '+(current===l[0]?'active':'')+'" onclick="openPage(\''+l[0]+'\')"><span class="num">'+('0'+(i+1)).slice(-2)+'</span>'+l[1]+'</button>').join('')
}
function selectGroup(id){group=id;current=groups.find(x=>x.id===id).links[0][0];renderNav();openPage(current)}
function openPage(id){
if(!navLock && (group!==window.dccShownGroup||id!==window.dccShownId) && window.dccShownId)navHistory.push({group:window.dccShownGroup,id:window.dccShownId});window.dccShownGroup=group;window.dccShownId=id;
current=id;let item=groups.find(x=>x.id===group)?.links.find(x=>x[0]===id);
if(!item){group='saengzone';item=groups[1].links.find(x=>x[0]===id)||groups[1].links[0]}
document.getElementById('pagetitle').textContent=item[1];document.getElementById('crumb').textContent=groups.find(x=>x.id===group).title+' / '+item[1];
if(id==='overview'){document.getElementById('bodybox').innerHTML=shortcutsHome();renderQuick();renderNav();return;}
const url={benefits:'payplay-benefits.html',catalog:'payplay-benefits.html#purpose',support:'payplay-benefits.html#benefit',road:'payplay-benefits.html#road',payplay:'https://nroad-dcc-test.vercel.app/payplay.html',overview:'https://nroad-dcc-test.vercel.app/',oc:'https://payplay-oc-v7.vercel.app/business-tasks'}[id];
let el=document.getElementById('bodybox');if(url){el.innerHTML='<iframe class="frame" title="작업 미리보기" src="'+url+'"></iframe>'}else{el.innerHTML='<div class="blank"><h2>'+item[1]+'</h2><p>기존 운영 프로젝트를 그대로 유지합니다. 해당 메뉴의 실제 원본 경로를 DCC 담당자가 연결해야 합니다.</p><a href="https://nroad-dcc-test.vercel.app/" target="_blank">기존 DCC에서 확인하기</a></div>'}
renderNav()
}
window.addEventListener('DOMContentLoaded',()=>{renderNav();openPage('overview')});
</script><div id="quickModal" class="quickmodal" onclick="if(event.target===this)closeQuickForm()"><div class="quickdialog"><h2 id="qtitle">바로가기</h2><form id="qform" onsubmit="return saveQuick(event)"><input type="hidden" id="qmode"><input type="hidden" id="qid"><label>이름<input id="qname" maxlength="80" required></label><label id="qurlwrap">주소(URL)<input id="qurl" placeholder="https://example.com"></label><label id="qgroupwrap">그룹<select id="qgroup"></select></label><label id="qdescwrap">설명<textarea id="qdesc" maxlength="200"></textarea></label><div class="actions"><button type="button" class="quickbtn" onclick="closeQuickForm()">취소</button><button class="quickbtn primary" type="submit">저장</button></div></form></div></div>
<script>
const quickKey='nroad_dcc_shortcuts_v09';let quickDb;
try{quickDb=JSON.parse(localStorage.getItem(quickKey)||'null')}catch(e){}
if(!quickDb||!Array.isArray(quickDb.groups)||!Array.isArray(quickDb.links)){quickDb={groups:[{id:'general',name:'자주 쓰는 사이트'},{id:'work',name:'프로젝트 허브'}],links:[{id:'nroad-hub',group:'work',name:'NROAD Hub',url:'https://nroad-hub.vercel.app/',desc:'엔로드 통합 허브'}]}}
function quickPersist(){localStorage.setItem(quickKey,JSON.stringify(quickDb))}
function quickEsc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shortcutsHome(){return `<div class="quickwrap"><div class="quickhead"><div><h1>내 바로가기</h1><p>그룹별로 자주 쓰는 웹사이트를 직접 등록하고 관리합니다.</p></div><div style="display:flex;gap:8px"><button class="quickbtn" onclick="openQuickForm('group')">+ 그룹 추가</button><button class="quickbtn primary" onclick="openQuickForm('link')">+ 링크 추가</button></div></div><input class="quick-search" placeholder="링크 또는 그룹 검색" oninput="renderQuick(this.value)" id="qsearch"><div id="quickresults"></div><p style="font-size:12px;color:#8492a7;margin-top:24px">현재 브라우저에만 저장되는 시연용 CRUD입니다. 로그인 간 동기화·권한·서버 저장은 아직 구현되지 않았습니다.</p></div>`}
function renderQuick(filter){const target=document.getElementById('quickresults');if(!target)return;let q=(filter||document.getElementById('qsearch')?.value||'').trim().toLowerCase();target.innerHTML=quickDb.groups.map(g=>{const links=quickDb.links.filter(x=>x.group===g.id&&(!q||[x.name,x.desc,x.url,g.name].join(' ').toLowerCase().includes(q)));if(q&&!links.length&&!g.name.toLowerCase().includes(q))return '';return `<section class="quickgrp"><div class="quickgrphead"><h2>${quickEsc(g.name)} · ${links.length}개</h2><button class="quickbtn" onclick="openQuickForm('group','${g.id}')">그룹 수정</button><button class="quickbtn" onclick="deleteQuickGroup('${g.id}')">그룹 삭제</button></div><div class="quickgrid">${links.map(x=>`<div class="quickcard"><a href="${quickEsc(x.url)}" target="_blank" rel="noopener noreferrer">${quickEsc(x.name)} ↗</a><p>${quickEsc(x.desc||x.url)}</p><div class="actions"><button onclick="openQuickForm('link','${x.id}')">수정</button><button onclick="deleteQuickLink('${x.id}')">삭제</button></div></div>`).join('')||'<p style="color:#8a96a8">등록된 링크가 없습니다.</p>'}</div></section>`}).join('')||'<p>일치하는 바로가기가 없습니다.</p>'}
function openQuickForm(mode,id){const obj=mode==='group'?quickDb.groups.find(x=>x.id===id):quickDb.links.find(x=>x.id===id);if(mode==='link'&&!quickDb.groups.length){alert('먼저 그룹을 추가하세요.');return}document.getElementById('qmode').value=mode;document.getElementById('qid').value=id||'';document.getElementById('qtitle').textContent=(id?'수정':'추가')+(mode==='group'?' · 그룹':' · 바로가기');document.getElementById('qname').value=obj?.name||'';document.getElementById('qurl').value=obj?.url||'';document.getElementById('qdesc').value=obj?.desc||'';document.getElementById('qurlwrap').hidden=mode==='group';document.getElementById('qgroupwrap').hidden=mode==='group';document.getElementById('qdescwrap').hidden=mode==='group';document.getElementById('qgroup').innerHTML=quickDb.groups.map(g=>`<option value="${quickEsc(g.id)}">${quickEsc(g.name)}</option>`).join('');document.getElementById('qgroup').value=obj?.group||quickDb.groups[0]?.id;document.getElementById('quickModal').classList.add('show')}
function closeQuickForm(){document.getElementById('quickModal').classList.remove('show')}
function saveQuick(e){e.preventDefault();const mode=document.getElementById('qmode').value,id=document.getElementById('qid').value;const name=document.getElementById('qname').value.trim();if(!name)return false;if(mode==='group'){const target=quickDb.groups.find(x=>x.id===id);if(target)target.name=name;else quickDb.groups.push({id:'g'+Date.now(),name})}else{const url=document.getElementById('qurl').value.trim();let parsed;try{parsed=new URL(url);if(!['https:','http:'].includes(parsed.protocol))throw Error()}catch{alert('https:// 또는 http:// 로 시작하는 유효한 주소를 입력하세요.');return false}let row={id:id||'l'+Date.now(),name,url:parsed.href,group:document.getElementById('qgroup').value,desc:document.getElementById('qdesc').value.trim()};const i=quickDb.links.findIndex(x=>x.id===id);if(i<0)quickDb.links.push(row);else quickDb.links[i]=row}quickPersist();closeQuickForm();renderQuick();return false}
function deleteQuickLink(id){if(confirm('바로가기를 삭제할까요?')){quickDb.links=quickDb.links.filter(x=>x.id!==id);quickPersist();renderQuick()}}
function deleteQuickGroup(id){const count=quickDb.links.filter(x=>x.group===id).length;if(!confirm('그룹과 포함된 링크 '+count+'개를 삭제할까요?'))return;quickDb.groups=quickDb.groups.filter(x=>x.id!==id);quickDb.links=quickDb.links.filter(x=>x.group!==id);quickPersist();renderQuick()}
</script></body></html>
